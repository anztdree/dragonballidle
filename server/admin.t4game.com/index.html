<script src="/static/js/particles.js"></script>
<script>
$(document).ready(function(){
	$("#username").focus();
});


$(document).on('click','.selectLoginType',function(){
	var type = $(this).attr('type');
	$(".selectLoginType").hide();
	$(".loginContent").hide();
	$("." + type).show();
	
	if(type ==  'qrloginArea'){
		createQRCode();
	}else{
		if(scode_interval != null){
			clearInterval(scode_interval);
		}
		$("#qrimg").attr('src','/static/images/waitload.gif')
	}
	localStorage.setItem('loginType',type);
	
})

$(document).on('keyup','.password',function(e){
	if(e.keyCode == 13){
		putlogin();
		return false;
	}
})

$(document).on('keyup','.username',function(e){
	if(e.keyCode == 13){
		$(".password").focus();
		return false;
	}
})

var loginType = localStorage.getItem('loginType');
if(loginType == 2){
	$(".selectLoginType").hide();
	$(".loginContent").show();
	$(".qrloginArea").show();
	createQRCode();
}

function ajaxRequestData(url,params,dataType,callback){
	var rebackObj=new Object();
	rebackObj.status=false;
	rebackObj.data='';
	rebackObj.message="";
	if(url=='' || url==undefined){
		rebackObj.msg="请求接口地址为空";
		return callback(rebackObj);
	}
	if(dataType=="" || dataType==undefined){
		dataType="json";
	}

	$.ajax({
		type:"POST",
		url:url,
		data:params,
		dataType:dataType,
		success:function(respData){
			if(dataType=="html" || dataType=="text"){
				rebackObj.data = respData;
				rebackObj.status = true;
				return callback(rebackObj);
			}
			if(!respData.hasOwnProperty('status') || respData.status == false ){
				if(rebackObj.message==undefined || respData.message=='' || !respData.hasOwnProperty('message')){
					rebackObj.message = '请求接口失败';
				}else{
					rebackObj.message=respData.message;
				}
				return callback(rebackObj);
			}
			rebackObj.data = respData;
			rebackObj.status = true;
			return callback(rebackObj);
		},
		error:function(){
			rebackObj.status=false;
			rebackObj.message="接口请求失败";
			return callback(rebackObj);
		}
		
	});
}

var pageconfig={};
pageconfig.referrer="";
var redirect = '';
var scode_interval = null;
function createQRCode(){
	try{clearInterval(scode_interval)}catch(e){}
	var url="/marketconsole/qrUrlcreate";
	var timestap = new Date().getTime();
	var urlData={logintype:'platformlogin',t_s:timestap,referrer:pageconfig.referrer};
	ajaxRequestData(url,urlData,"json",function(rebackData){

		if(rebackData.status==false){
			layer.msg(rebackData.message,{icon:2});
		}else{
			var qrurl = rebackData.data.data.qrurl;
			var token = rebackData.data.data.token;
			if(qrurl=="" || qrurl== undefined || token=="" || token == undefined){
				layer.msg("获取登录二维码失败",{icon:2});
				return false;
			}else{
				var imgUrl ='/marketconsole/qrImgCreate?data='+qrurl;
				$(".qrbox .right").show();
				$("#qrimg").attr("src",imgUrl);
				$(".qr-fail-box").hide();
				$(".qr-success-box").hide();
				scode_interval = setInterval(function(){checkTokenLogin(token);},1000);
			}
		}
	});
}
$(document).on("click",".qr-fail-link",function(){
	createQRCode();
});

function checkTokenLogin(token){
	var url="/marketconsole/ckTokenLogin?type=1";
	var timestap = new Date().getTime();
	var urlData={logintype:2,t_s:timestap,token:token,redirect:redirect};
	ajaxRequestData(url,urlData,"json",function(rebackData){
		if(rebackData.status==true){
			if(rebackData.data.data.code==101){
				$(".qr-fail-box .qr-fail-p").html(rebackData.data.data.message);
				$(".qr-fail-box").show();
				$(".qr-success-box").hide();
				try{clearInterval(scode_interval)}catch(e){}
			}else if(rebackData.data.data.code==200){
				$(".qr-success-box .qr-success-user").html(rebackData.data.data.username);
				$(".qr-fail-box").hide();
				$(".qr-success-box").show();
				$(".qrimg-box").hide();
				try{clearInterval(scode_interval)}catch(e){}
				var runTo = rebackData.data.data.runTo;
				setTimeout(function(){
					location.href = runTo;	
				},2000)
			}
		}
	});
}


$(document).on('click','.showHelp',function(){
	var type = $(this).attr('type');
	var newType = type == 1 ? 2 : 1;
	$(this).attr('type',newType);
	if(type == 1){
		$(".qrhelpshow").addClass('show');
	}else{
		$(".qrhelpshow").removeClass('show');
	}
})

$(document).keyup(function(event){
	if(event.keyCode == 13){
		$("#loginForm").submit();
	}
});
$(document).on("click",".loginButton",function(){
	//$("#loginForm").submit();
	putlogin();
})

$TN.onsuccess(function(){
	//验证通过
	var date = new Date();
 	var m = 1;
	date.setTime(date.getTime() + (m * 60 * 1000));
	$.cookie('tncode_check_base','ok', { expires: date })
	putlogin();
});

function putlogin(e){
	var username = $('input[name="username"]').val();
	var password = $('input[name="password"]').val();
	var checkCode = $('#checkCode').val();
	var referUrl=$("#referUrl").val();
	if(username=="" || username==undefined){
		layer.msg('请输入用户名', {tips:[2,'#FF9900'],time:2500});
		return false;
	}
	if(password=="" || password==undefined){
		layer.msg('请输入密码', {tips:[2,'#FF9900'],time:2500});
		return false;
	}
	
		if(checkCode=="" || checkCode==undefined){
		layer.msg('请输入验证码', {tips:[2,'#FF9900'],time:2500});
		return false;
	}
		
	$.post('/base/loginHandle',{username:username,password:password,checkCode:checkCode,referUrl:referUrl},function(data){
		
		if(data.status == false){
			$('#checkCodeImg').click();
			layer.msg('<font style="font-size:14px">' + data.message +'</font>', {tips:[2,'#FF9900'],time:2500});
		}else{
			location.href = data.url;
		}
		
	},'json');
	return false;
}
